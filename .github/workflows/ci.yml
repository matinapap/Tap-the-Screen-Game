name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FrogGame.sln

      - name: Build
        run: dotnet build FrogGame.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FrogGame.sln --configuration Release --no-build --verbosity normal

      - name: Upload game build
        uses: actions/upload-artifact@v4
        with:
          name: FrogGame-windows
          path: src/FrogGame.WinForms/bin/Release/net472/
